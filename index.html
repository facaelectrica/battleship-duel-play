/* Layout: the world canvas with the controls canvas stacked on top, both full-bleed */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --ink: #04070f;
  --deep: #0b2560;
  --foam: #eaf8ff;
  --font-ui: "Silkscreen", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: #000; overflow: hidden; overscroll-behavior: none; }
/* (user Nov 7, iPad 27.2 from its Home Screen icon: iOS lays a Home Screen app out a status bar's height short of the screen - a black band
   at the foot. There the page is the whole screen - 100lvh, as there's no toolbar to collapse - and the body is what fixed panels are placed
   in, so one at bottom: 8px sits at the screen's real foot. html.fsapp: pageBox, 00-sw-boot.js) */
html.fsapp, html.fsapp body { height: max(100%, 100lvh); }
html.fsapp body { contain: layout; }
/* (same day: the iPad dims the page under its status bar with a fade a little deeper than the bar itself. An editor's panels start below
   both; 8px where there's no bar) */
:root { --below-bar: calc(8px + 1.8 * env(safe-area-inset-top, 0px)); }
body {
  touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: var(--font-ui); color: var(--foam);
}
[hidden] { display: none !important; }
#stage { position: fixed; inset: 0; background: #000; }   /* (user Oct 25: black outside the play area, not blue) */
/* the world and the controls are drawn at their pixel-art resolution and blown up by the browser
   (nearest-neighbour), so no full-screen copy is needed every frame */
#game, #hud { position: absolute; left: 0; top: 0; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
#hud { pointer-events: none; }
#rotate {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  background: var(--ink); color: var(--foam); font-size: 16px; letter-spacing: 0.1em; line-height: 1.8;
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px));
}
#rotate small { display: block; opacity: 0.7; font-size: 12px; }
</style>
