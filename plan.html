<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Far Away — World Plan</title>
<style id="css">
:root{--bg:#4b4b4b;--ink:#f1e7c8;--ocean:#e9b52c;--ui:#2f2f2f;--ui2:#3a3a3a;--line:#5c5c5c;--hi:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh}
#bar button{font-size:14px}
#bar{display:flex;gap:5px;align-items:center;padding:8px;padding-top:max(8px,env(safe-area-inset-top));background:var(--ui);overflow-x:auto;flex:none;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
button{font:inherit;color:var(--ink);background:var(--ui2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 11px;white-space:nowrap;cursor:pointer;touch-action:manipulation}
button:active{background:#555}
button.on{background:var(--ink);color:#222;border-color:var(--ink)}
button.save.dirty{background:var(--ocean);color:#222;border-color:var(--ocean)}
button:disabled{opacity:.35}
#title{font-size:18px;color:var(--ocean);padding:0 6px;white-space:nowrap;display:flex;flex-direction:column;line-height:1.1}
#ver{font-size:10px;letter-spacing:.06em;opacity:.7}
.sp{flex:1}
#main{position:relative;flex:1;min-height:0;display:flex}
#stage{position:relative;flex:1;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);opacity:.6;text-align:center;pointer-events:none;font-size:18px}
#panel{width:320px;flex:none;background:var(--ui);border-left:1px solid var(--line);overflow-y:auto;padding:12px;-webkit-user-select:text;user-select:text;display:none}
#panel.open{display:block}
#panel h3{margin:4px 0 10px;font-size:15px;letter-spacing:.05em}
label{display:block;font-size:12px;opacity:.75;margin:10px 0 4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;color:var(--ink);background:#222;border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.row button{flex:1}
.links div{padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:6px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:40px;padding:0 10px}
#help{flex:none;font-size:12px;opacity:.7;padding:6px 10px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pop,#modal{position:absolute;display:none;z-index:5}
#pop{background:var(--ui);border:1px solid var(--line);border-radius:12px;padding:10px;width:300px;max-height:70%;overflow-y:auto;box-shadow:0 8px 30px #0008}
#pop .cat{font-size:12px;opacity:.75;margin:10px 0 4px}
#pop .chips button{min-height:38px}
#edit{position:absolute;display:none;z-index:6;width:220px;text-align:center}
#modal{position:fixed;inset:0;background:#000a;align-items:center;justify-content:center}
#modal .box{background:var(--ui);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(560px,92vw);max-height:86vh;overflow:auto}
#modal textarea{min-height:240px;font:12px/1.4 ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:#222;border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:9}
#lists{flex:1;min-width:0;display:none;overflow:auto;padding:12px;gap:10px;align-items:flex-start;-webkit-user-select:text;user-select:text}
#lists.open{display:flex;flex-wrap:nowrap;align-items:stretch;overflow-x:auto;overflow-y:hidden}
.lcol{background:var(--ui);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;width:250px;flex:none;min-height:0}
.lcol h3{margin:2px 0 8px;font-size:14px;letter-spacing:.05em}
.lrows{overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.acts{flex-wrap:nowrap!important;gap:4px}.acts button{flex:1 1 0;min-width:0;padding:0 2px;font-size:11px;letter-spacing:0}
.plist{display:flex;flex-direction:column;gap:6px}.plist button{min-height:42px;text-align:left;padding:0 12px}
#lpanel{min-height:0}
#editor{flex:1;min-width:0;display:none;gap:10px;padding:10px}#editor.open{display:flex}
#elist{width:200px;flex:none;overflow-y:auto;background:var(--ui);border:1px solid var(--line);border-radius:12px;padding:8px}#elist h3{font-size:13px;letter-spacing:.05em;margin:12px 4px 4px}
#elist .lrow{min-height:48px}.ith{width:44px;height:44px;flex:none}
#ecv{flex:1;min-width:0;display:block;height:100%;background:var(--ui);border:1px solid var(--line);border-radius:12px;touch-action:none}
#epanel{width:320px;flex:none;background:var(--ui);border-left:1px solid var(--line);overflow-y:auto;padding:12px;display:none;min-height:0}#epanel h3{margin:4px 0 10px;font-size:15px;letter-spacing:.05em}
.lbox{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:2px}
.lrow.ty{padding-left:22px;min-height:38px}
.lrow.sh{padding-left:4px;font-weight:700;letter-spacing:.02em}
.lrow.sh .sub{font-weight:400;color:var(--ink,#eee)}
#lpanel{width:320px;flex:none;background:var(--ui);border-left:1px solid var(--line);overflow-y:auto;padding:12px;display:none}
#lpanel h3{margin:4px 0 10px;font-size:15px;letter-spacing:.05em}
.lrow{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 8px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.lrow.on{background:#555;border-color:#fff}
.lrow .dot{width:14px;height:14px;border-radius:50%;flex:none}
.lrow .nm{flex:1}
.lrow .sub{font-size:12px;opacity:.65}
.ladd{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ladd input{flex:1;min-width:0}
.ladd select{flex:1 0 100%}
#lbar{display:none;gap:6px;align-items:center}
.multi .mbtn{width:100%;text-align:left;background:#222;border-radius:8px}
.multi .mlist{border:1px solid var(--line);border-radius:8px;margin-top:4px;background:#222;max-height:260px;overflow-y:auto}
.multi .mrow{min-height:44px;padding:10px 12px;border-bottom:1px solid #333;cursor:pointer}
.multi .mrow:last-child{border-bottom:0}
#time{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:2px;background:rgba(47,47,47,.92);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
#time input[type=range]{flex:1;min-height:40px;padding:0;background:none;border:0;outline:none}
#time button{min-width:44px;padding:0 10px}
#time .trow{display:flex;gap:6px;align-items:center}
#tDayL,#tPartL{min-width:110px;text-align:right;font-weight:600;color:var(--ocean)}
@media (max-width:760px){#main{flex-direction:column}#panel,#lpanel,#epanel{width:auto;max-height:45%;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<script id="planSrc">
'use strict';
const UPM=63.75/9.83,KN=.5144*UPM,KMH=UPM/3.6; // world units a metre; a second per knot; a second per km/h
const MU=10*UPM; // how many world units the drawing's sizes are made for (icons and land read the same at the starting zoom)
const SHELL=`<div id="app">
  <div id="bar">
    <span id="title">FAR AWAY<small id="ver">v31</small></span>
    <button id="tWorld" class="on" title="The world map">WORLD</button>
    <button id="tLists" title="Every list: categories, types, owners, countries, goods, biomes">LISTS</button>
    <button id="tEditor" title="Draw the icons">EDITOR</button>
    <button data-world id="bAdd" title="Add a place, structure, vehicle…">+ ADD</button>
    <button data-world id="bMore" title="Tap items to pick several; drag empty space to box-pick">PICK MORE</button>
    <button id="bUndo" title="Undo">UNDO</button>
    <button id="bRedo" title="Redo">REDO</button>
    <button data-world id="bFit" title="Zoom to fit the whole world">FIT</button>
    <button data-world id="bLabels" class="on" title="Show or hide connection labels">LABELS</button>
    <button data-world id="bShow" title="Show or hide categories">SHOW</button>
    <span class="sp"></span>
    <button id="bFile" title="Export, import or start over">FILE</button>
    <button id="bRevert" title="Go back to the last saved plan">REVERT ALL CHANGES</button>
    
    <button id="bSave" class="save" title="Save the plan to GitHub">SAVE CHANGES</button>
  </div>
  <div id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint">Double-tap to add something</div>
      <div id="pop"></div>
      <input id="edit" autocomplete="off" autocapitalize="words">
      <div id="time"><div class="trow"><button id="tPlay" title="Play">▶</button><button id="tBack" title="Day before">‹</button><input id="tDay" type="range" min="0" max="59" step="1" value="0"><button id="tNext" title="Next day">›</button><span id="tDayL">DAY 0</span></div>
        <div class="trow"><span class="sub" style="width:96px">TIME OF DAY</span><input id="tPart" type="range" min="0" max="23.99" step="0.25" value="0"><span id="tPartL">MORNING</span></div></div>
    </div>
    <div id="panel"></div>
    <div id="lists"></div>
    <div id="editor"><div id="elist"></div><canvas id="ecv"></canvas></div><div id="epanel"></div>
    <div id="lpanel"></div>
  </div>
  <div id="help">Double-tap: add · Drag ●: connect · Drag empty: pan · Pinch: zoom</div>
</div>
<div id="modal"><div class="box"></div></div>
<div id="toast"></div>`;
document.body.insertAdjacentHTML('afterbegin',SHELL);
/* ---------- definitions ---------- */
/* KIND decides how a thing behaves (land, town, stands on land…); CATEGORY and TYPE are the world's own lists, grown from the dropdowns */
const CATS={ // KIND: what was added - it never changes
  region:{name:'Terrain',color:'#e9b52c'},
  structure:{name:'Structure',color:'#efe0b0'},
  vehicle:{name:'Vehicle',color:'#7d9bff'},
  nature:{name:'Nature',color:'#7fd99a'},
};
const KIND_ORDER=['structure','vehicle','nature'];
/* TYPE: what a thing is and what it does (its purposes) - one list, grown and edited from the dropdowns and LISTS */
const PURPOSES={structure:[['holds','Stores vehicles'],['stores','Stores goods'],['sells','Sells goods'],['residence','Is residence'],['water','On water'],['stretch','Stretchable']],
  vehicle:[['water','Needs dock']],nature:[['gives','Produces goods']]};
const slug=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const DEFAULT_SUBS=[ // CATEGORY > SUBCATEGORY (says what it does) > TYPE (the game's names)
  ['structure','Dock:water holds stretch,Lighthouse,Shipyard:holds,Crane,Marine Hangar:holds,Storage Yard:stores,Terminal:stores,Airport:holds,Runway:stretch,Aircraft Hangar:holds,Control Tower,Helipad:holds,Market:stores sells,Pharmacy:stores sells,Hospital,School,Church,Fire Station:holds,Police Station:holds,Garage:holds,House:residence,Hut:residence,Building,Taxi Stand'],
  ['vehicle','Boats:water,Ships:water,Submarines:water,Cars,Trucks,Buses,Emergency,Farm,Planes,Helicopters,Airships'],
  ['nature','Fish Area:gives,Shark Area,Whale Area,Kraken,Pirate Wreck,Forest']]
  .flatMap(([kind,l])=>l.split(',').map(x=>{const[n,d]=x.split(':');return{id:slug(n),kind,name:n,does:d?d.split(' '):[],...(n==='Fish Area'?{gives:['fish'],rate:25}:{})}}));
const DEFAULT_TYPES=[['boats','Fishing Boat,Sailboat,Motor Boat,Jet Boat,Yacht'],['ships','Small Cargo Ship,Cargo Ship,Tanker,Cruise Ship'],['submarines','Submarine'],['cars','Car,Taxi,Van'],['trucks','Truck,Small Truck'],
  ['buses','Bus'],['emergency','Ambulance,Fire Engine'],['farm','Tractor'],['planes','Cessna,Airliner,Seaplane:water'],['helicopters','Helicopter'],['airships','Blimp,Balloon']]
  .flatMap(([sub,l])=>l.split(',').map(x=>{const[n,d]=x.split(':');return{id:slug(n),sub,name:n,...(d?{does:d.split(' ')}:{})}}));
const LEGACY_TYPES=[...DEFAULT_SUBS.filter(s=>s.kind!=='vehicle'),...DEFAULT_TYPES.map(t=>{const s=DEFAULT_SUBS.find(x=>x.id===t.sub);return{id:t.id,kind:'vehicle',name:t.name,does:[...new Set([...s.does,...(t.does||[])])]}})]; // plans from before subcategories
const DEFAULT_BIOMES=[ // the game's biomes, one colour each so the land reads at a glance
  {id:'forest',name:'Forest',color:'#3f9a52',h:50*MU},{id:'jungle',name:'Jungle',color:'#2fd06a',h:55*MU},{id:'beach',name:'Beach',color:'#f2d36b',h:28*MU},{id:'desert',name:'Desert',color:'#e4a55a',h:40*MU},
  {id:'mountain',name:'Mountain',color:'#a3a8ad',h:220*MU,peak:1},{id:'ice',name:'Ice',color:'#c4ecfa',h:60*MU},{id:'swamp',name:'Swamp',color:'#8a9a42',h:25*MU},{id:'volcanic',name:'Volcanic',color:'#c4553c',h:240*MU,peak:2}];
const DEFAULT_GOODS=[{id:'fish',name:'Fish'},{id:'goods',name:'Goods'},{id:'passengers',name:'Passengers'},{id:'medicine',name:'Medicine'},{id:'fuel',name:'Fuel'}];
const DEFAULT_TASKS=[{id:'pick',name:'Collect',act:'collect'},{id:'drop',name:'Deliver cargo',act:'drop'},{id:'goto',name:'Travel',act:'goto'}];
const ACTS=['goto','collect','drop'];
const routeEnd=X=>doc.connections.filter(c=>c.to===X&&tripEnds(c)&&!doc.connections.some(n=>n.after===c.id)); // routes that end at X and can go on // what a task does: go there, collect a good there until it has enough, drop what it carries there
/* the GAME's units, speeds and clock (src/01-zz-real-scale.js, 36-sea-storm-weather.js, 50-story-0-cfg.js): map units ARE the game's world units */
const CLOCK=[[5,8,3/120],[8,16.5,8.5/360],[16.5,19.2,2.7/120],[19.2,29,9.8/120]]; // Story's day: game hours a real second (2 min sunrise, 6 day, 2 sunset, 2 night = 12 min)
const clockRate=h=>{h%=24;for(const[a,b,r]of CLOCK)if((h>=a&&h<b)||(h+24>=a&&h+24<b))return r;return CLOCK[1][2]};
const gameHours=(h0,secs)=>{let h=h0,left=secs;for(let i=0;i<200&&left>1e-6;i++){const r=clockRate(h),nx=[5,8,16.5,19.2,24].find(e=>e>h%24+1e-9)-h%24,need=nx/r;if(need>=left){h+=left*r;left=0}else{h+=nx;left-=need}}return h-h0}; // real seconds from game hour h0, in game hours
const SLOTS=['Morning','Midday','Afternoon','Night'],SLOT_HOURS=[9,12,15,21]; // leaving times; the calendar starts at day 0, 00:00
const SPEEDS={'fishing-boat':60,'motor-boat':55,'jet-boat':115, // world units a second, as the game moves them (50-land-traffic.js newJetboat)
  'cargo-ship':20*KN,tanker:14.5*KN,'cruise-ship':26*KN,'small-cargo-ship':12*KN, // service speeds (50-land-civships.js; small cargo = the research ship's)
  car:14*UPM,taxi:14*UPM,van:14*UPM,bus:14*UPM,ambulance:14*UPM,'fire-engine':14*UPM,truck:14*UPM,'small-truck':14*UPM, // CAR_V (50-story-cars.js)
  cessna:200*KMH,seaplane:150*KMH,airliner:250*KMH,helicopter:100*KMH, // AIR_KMH
  sailboat:6*KN,yacht:6*KN,submarine:15*KN,tractor:6*UPM,blimp:60*KMH,balloon:15*KMH}; // (not in the game's tables yet: guesses)
const speedOf=V=>{const t=typeOf(V);return Math.round(t&&t.speed||SPEEDS[V.type]||14*UPM)};
const kmhOf=u=>Math.round(u/KMH);
const spotOf=e=>{const h=e&&heldBy(e);return h||e}; // where it is: a vehicle is where it is kept
const distU=(a,b)=>{a=spotOf(a);b=spotOf(b);return a&&b?Math.hypot(a.x-b.x,a.y-b.y):0},distKm=(a,b)=>distU(a,b)/UPM/1000; // world units, and km
const hrs=h=>h<1/60?'under a minute':h<1?Math.round(h*60)+' min':Math.floor(h)+' h'+(Math.round(h%1*60)?' '+Math.round(h%1*60)+' min':'');
const clock=h=>String(Math.floor(h%24)).padStart(2,'0')+':'+String(Math.floor(h%1*60)).padStart(2,'0');
const partOf=h=>{h%=24;return h<6||h>=20?'Night':h<11?'Morning':h<14?'Midday':'Afternoon'};
const GOODS_FIELD={vehicle:['carries','Carries'],structure:['stores','Stores'],nature:['gives','Gives']};
const goodsField=e=>e.kind==='vehicle'||(e.kind==='nature'&&does(e,'gives'))?GOODS_FIELD[e.kind]:null; // a structure holds what its type says, any goods
const takesCargo=X=>X&&X.kind==='structure'&&['stores','sells'].some(p=>does(X,p)); // carrying, storing, giving: the same goods list
const BIOME_COLS=['#3f9a52','#2fd06a','#f2d36b','#e4a55a','#a3a8ad','#c4ecfa','#8a9a42','#c4553c','#d9c7a3','#6fb3d2','#9c7bd1','#e8e8e8'];
const KINDS={
  travel:{name:'Travel',color:'#ff7a45',dash:false},
  goods:{name:'Goods',color:'#6f8cff',dash:false},
  people:{name:'People',color:'#c49bff',dash:false},
  needs:{name:'Needs / supplies',color:'#7fd99a',dash:true},
  helps:{name:'Helps / serves',color:'#5fd4e0',dash:true},
  other:{name:'Other',color:'#d4d4d4',dash:true},
};
const az=(a,b)=>String(a).localeCompare(String(b),undefined,{sensitivity:'base',numeric:true}); // every list is shown A to Z
const subOf=e=>e&&e.sub&&doc.subs.find(t=>t.id===e.sub);
const typeOf=e=>e&&e.type&&doc.types.find(t=>t.id===e.type);
const tn=e=>(typeOf(e)||subOf(e)||{}).name||''; // its type's name, else its subcategory's
const does=(e,p)=>((subOf(e)||{}).does||[]).includes(p)||((typeOf(e)||{}).does||[]).includes(p); // the subcategory says what it does (a type may add: a seaplane is on the water)
const byName=l=>[...l].sort((a,b)=>az(a.name||tn(a)||'',b.name||tn(b)||''));


const carriesOf=V=>(typeOf(V)||{}).carries||[]; // a vehicle type's goods (none = anything)
const givesOf=X=>(subOf(X)||{}).gives||[],rateOf=X=>(subOf(X)||{}).rate||25; // a nature subcategory gives these, so many a game hour
const subsOfKind=k=>byName(doc.subs.filter(t=>t.kind===k));
const typesOfSub=id=>byName(doc.types.filter(t=>t.sub===id));
const kindOfSub=id=>(doc.subs.find(t=>t.id===id)||{}).kind;
const typesOfKind=k=>byName(doc.types.filter(t=>kindOfSub(t.sub)===k));

const vehShape=e=>{const t=tn(e).toLowerCase();
  return /plane|air|heli|fly|blimp|balloon|cessna/.test(t)?'plane':/sub/.test(t)?'sub':/car|truck|road|bus|taxi|van|tractor|ambulance|engine/.test(t)?'car':'boat'};
const biomeOf=e=>doc.biomes.find(b=>b.id===e.biome)||doc.biomes[0]||{name:'Land',color:'#e9b52c',h:40*MU};
/* a region is a piece of land on the ocean line: its outline in world units (y up is negative) */
function regionPts(e){const w=e.w||400*MU,h=e.h||40*MU,x0=e.x-w/2,x1=e.x+w/2,pk=biomeOf(e).peak;
  if(pk===2)return[[x0,0],[x0+w*.18,-h*.3],[e.x-w*.07,-h],[e.x+w*.07,-h],[x1-w*.18,-h*.3],[x1,0]];
  if(pk===1)return[[x0,0],[x0+w*.2,-h*.35],[e.x,-h],[x1-w*.2,-h*.35],[x1,0]];
  const s=Math.min(h*1.6,w/4);return[[x0,0],[x0+s,-h],[x1-s,-h],[x1,0]]}
function topAt(e,x){const p=regionPts(e);for(let i=1;i<p.length;i++)if(x<=p[i][0]){const a=p[i-1],b=p[i],t=(x-a[0])/((b[0]-a[0])||1);return a[1]+(b[1]-a[1])*Math.min(1,Math.max(0,t))}return 0}
const isLand=e=>e&&e.kind==='region';
const OWNER_COLS=['#ff6b6b','#4dabf7','#ffa94d','#b197fc','#63e6be','#f783ac','#ffd43b','#a9e34b','#e599f7','#74c0fc','#ff922b','#20c997'];
const nextOwnerCol=()=>OWNER_COLS.find(c=>!doc.characters.some(h=>h.color===c))||OWNER_COLS[doc.characters.length%OWNER_COLS.length];
const ownerOf=e=>e.owner&&doc.characters.find(h=>h.id===e.owner);
const itemCol=e=>{const o=ownerOf(e);return o?o.color:CATS[e.kind].color}; // owned things wear their owner's colour
const onWater=e=>e.kind==='structure'&&does(e,'water');
const SNAPS=e=>!isLand(e)&&e.kind!=='place'&&e.kind!=='vehicle'&&!onWater(e); // what stands on land when dropped there (vehicles start at a structure)
const isWaterVeh=e=>e.kind==='vehicle'&&does(e,'water'); // always at a dock (or in a marine hangar)
const holderKind=h=>!h?null:onWater(h)?'dock':h.kind==='structure'?(does(h,'holds')?'hangar':'yard'):null; // dock: moored beside; hangar: on its roof; any other structure: beside it
const forBoats=h=>onWater(h)||(does(h,'holds')&&/marine|shipyard|boat/i.test(tn(h)));
const canHold=(h,v)=>{const k=holderKind(h);if(!k||v.kind!=='vehicle')return false;return isWaterVeh(v)?forBoats(h):k!=='dock'};

/* ---------- saving: the plan is worlds/plan.json in the game repo, through GitHub with the world page's token ---------- */
const GH={owner:'facaelectrica',repo:'battleship-duel',path:'worlds/plan.json',branch:'main'};
const GH_API='https://api.github.com/repos/'+GH.owner+'/'+GH.repo;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let token=lsGet('wp_token'),remoteSha=null,loaded=false;
const PREVIEW=!!window.PLAN_SEED; // the claude.ai preview copy: opens the saved plan, cannot save
async function gh(path,opt={},tok=token){
  const r=await fetch(path.startsWith('http')?path:GH_API+path,{...opt,cache:'no-store',headers:{Accept:'application/vnd.github+json',...(tok?{Authorization:'Bearer '+tok}:{}),'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.message||('HTTP '+r.status));e.status=r.status;throw e}
  return j}

const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function fetchPlan(){ // {sha, data} - data null when there's no plan yet
  try{const j=await gh('/contents/'+GH.path+'?ref='+GH.branch);return{sha:j.sha,data:JSON.parse(unb64(j.content))}}
  catch(e){if(e.status===404)return{sha:null,data:null};throw e}}
function askToken(why){
  modal(`<h3>GITHUB TOKEN</h3><p>${esc(why||'The plan is kept in the game repo on GitHub.')} Paste the same token the world page uses — its steps are on the <a href="world.html" target="_blank" rel="noopener">world page</a>. It stays in this browser only.</p>
  <input id="tTok" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row"><button id="tSave">SAVE TOKEN</button><button data-close>LATER</button></div>`,()=>{
    $('#tSave').onclick=async()=>{const t=$('#tTok').value.trim();if(!t)return;$('#tSave').textContent='CHECKING…';
      try{await gh('',{},t);token=t;lsSet('wp_token',t);toast('Token saved');location.reload()}
      catch(e){$('#tSave').textContent='SAVE TOKEN';toast(e.status===401?'That token doesn’t work':e.status===404||e.status===403?'That token can’t reach the game repo':'Token: '+e.message)}}})}
async function putPlan(sha){const body={message:'World plan: saved from the planner',content:b64(exportJson()),branch:GH.branch};if(sha)body.sha=sha;
  const j=await gh('/contents/'+GH.path,{method:'PUT',body:JSON.stringify(body)});remoteSha=j.content.sha}
$('#bSave').onclick=async()=>{
  if(PREVIEW){toast('Preview copy: save from the GitHub page');return}
  if(!token)return askToken('To save, the planner needs your GitHub token.');
  if(lastSnap===savedSnap&&loaded){toast('Already saved');return}
  const prev=doc.savedAt;doc.savedAt=new Date().toISOString();$('#bSave').textContent='SAVING…';
  try{await putPlan(remoteSha);loaded=true;savedSnap=lastSnap;changed();toast('Saved to GitHub')}
  catch(e){doc.savedAt=prev;changed();
    if(e.status===401)askToken('Your token has expired — make a new one.');
    else if(e.status===409||e.status===422)modal(`<h3>SAVED ELSEWHERE</h3><p>The plan was saved from another device since you opened it.</p><div class="row"><button id="cMine">SAVE MINE over it</button><button id="cTheirs">OPEN that one</button></div><div class="row"><button data-close>CANCEL</button></div>`,()=>{
      $('#cMine').onclick=async()=>{closeModal();try{const r=await fetchPlan();doc.savedAt=new Date().toISOString();await putPlan(r.sha);savedSnap=lastSnap;changed();toast('Saved to GitHub')}catch(err){toast('Save failed: '+err.message)}};
      $('#cTheirs').onclick=()=>{lsSet('farAwayPlanDraft',null);savedSnap=lastSnap;location.reload()}});
    else toast('Save failed: '+e.message)}
};
$('#bRevert').onclick=()=>{if(lastSnap===savedSnap)return;
  modal(`<h3>REVERT ALL CHANGES?</h3><p>Everything since your last save goes back to the saved plan. UNDO can still bring it back.</p><div class="row"><button id="rYes">YES</button><button data-close>NO</button></div>`,()=>{
    $('#rYes').onclick=()=>{closeModal();undoS.push(lastSnap);redoS.length=0;restore(savedSnap);fit();toast('Back to the saved plan')}})};

  const tag=document.activeElement?.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  const m=ev.ctrlKey||ev.metaKey,k=ev.key.toLowerCase();
  if(m&&k==='z'){ev.preventDefault();ev.shiftKey?redo():undo()}else if(m&&k==='y'){ev.preventDefault();redo()}
  else if(m&&k==='c'){if(copySel())toast('Copied')}else if(m&&k==='v'){paste()}
  else if(m&&k==='d'){ev.preventDefault();duplicate()}else if(m&&k==='a'){ev.preventDefault();sel={els:new Set(doc.elements.filter(visible).map(e=>e.id)),links:new Set()};panel();draw()}
  else if(k==='delete'||k==='backspace'){removeSel()}else if(k==='f'){fit()}
  else if(k==='enter'||k==='f2'){if(sel.els.size===1)startEdit('el',[...sel.els][0]);}
  else if(k==='escape'){closePop();closeModal();setPending(null);sel={els:new Set(),links:new Set()};panel();draw()}
  else if(k==='n'){openAdd(null,null)}
});

/* ---------- prefs & boot ---------- */
function prefsSave(){try{localStorage.setItem('farAwayPlanPrefs',JSON.stringify({labels:showLabels,hidden:[...hidden]}))}catch(e){}}
function prefsLoad(){try{const p=JSON.parse(localStorage.getItem('farAwayPlanPrefs')||'{}');if(p.labels===false){showLabels=false;$('#bLabels').classList.remove('on')}if(Array.isArray(p.hidden))hidden=new Set(p.hidden)}catch(e){}}
window.addEventListener('resize',resize);
async function boot(){
  prefsLoad();resize();doc=emptyDoc();
  if(PREVIEW){try{doc=sanitize(window.PLAN_SEED)}catch(e){}}
  else if(token){try{const r=await fetchPlan();remoteSha=r.sha;if(r.data)doc=sanitize(r.data);loaded=true}
    catch(e){if(e.status===401)askToken('Your token has expired — make a new one.');else toast('Couldn’t open the plan from GitHub: '+e.message)}}
  reindex();lastSnap=savedSnap=snap();
  try{const d=JSON.parse(lsGet('farAwayPlanDraft')||'null');
    if(d&&d.snap&&(!loaded||(d.base||null)===(remoteSha||null))){const o=sanitize(JSON.parse(d.snap)),n=JSON.stringify(pick(o));
      if(n!==savedSnap){restore(n);undoS=[savedSnap];toast('Picked up your unsaved changes')}}
    else if(d&&d.snap){const o=sanitize(JSON.parse(d.snap)),n=JSON.stringify(pick(o));
      if(n!==savedSnap&&o.elements.length)modal(`<h3>UNSAVED CHANGES</h3><p>This browser has changes that were never saved, made on an older version of the plan.</p><div class="row"><button id="dKeep">KEEP my changes</button><button id="dDrop">USE the saved plan</button></div>`,()=>{
        $('#dKeep').onclick=()=>{closeModal();restore(n);undoS=[savedSnap];fit()};$('#dDrop').onclick=()=>{closeModal();changed()}})}}catch(e){}
  changed();fit();setT(0);
  if(!token&&!PREVIEW)askToken();
}
boot();
</script>
