<!doctype html><meta charset="utf-8"><title>shader bench</title><pre id="o">running...</pre><script>
(async () => {
  const out = []; const say = t => { out.push(t); document.getElementById('o').textContent = out.join('\n'); };
  const ad = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }), dev = await ad.requestDevice({ requiredLimits: { maxStorageBuffersPerShaderStage: Math.min(8, ad.limits.maxStorageBuffersPerShaderStage) } });
  dev.addEventListener('uncapturederror', e => say('ERR ' + e.error.message.slice(0, 300)));
  const names = (new URLSearchParams(location.search).get('v') || 'old,new,oneTap,thinTap').split(',');
  const R = window.__R = [];
  for (const nm of names) {
    const code0 = await (await fetch('sh/' + nm + '.wgsl')).text();
    for (const rep of [0, 1]) {
      const code = '// ' + nm + ' ' + (rep ? 'again' : Date.now() + Math.random()) + '\n' + code0;
      const m = dev.createShaderModule({ code, label: nm });
      const ci = await m.getCompilationInfo(); const errs = ci.messages.filter(x => x.type === 'error');
      if (errs.length) { say(nm + ' WGSL error: ' + errs[0].message + ' line ' + errs[0].lineNum); break; }
      const t0 = performance.now();
      try { await dev.createRenderPipelineAsync({ layout: 'auto', vertex: { module: m, entryPoint: 'vs' }, fragment: { module: m, entryPoint: 'fs', targets: [{ format: 'rgba8unorm', blend: { color: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' }, alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' } } }] }, primitive: { topology: 'triangle-list' } }); }
      catch (e) { say(nm + ' pipeline error: ' + String(e.message || e).slice(0, 300)); break; }
      const ms = Math.round(performance.now() - t0); R.push([nm, rep, ms]); say(nm + (rep ? ' (same again)' : '') + ': ' + ms + ' ms');
      if (rep === 0 && false) break;
    }
  }
  say('done'); window.__done = true;
})();
</script>
