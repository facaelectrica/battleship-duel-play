<style>

#stage { position: fixed; inset: 0; background: #000; cursor: grab; }

#sunMark { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid #ffb347; border-radius: 50%; box-sizing: border-box; display: none; box-shadow: 0 0 0 1px #0008; pointer-events: none; z-index: 5; }

<div id="stage"><canvas id="px"></canvas><div id="sunMark"></div><div id="bar"></div><div id="stats"></div><div id="tip">drag: pan along the world and up into the sky · wheel: the game's zoom steps · double-click: horizon back · E: the SKY EDITOR</div></div>
<script>
'use strict';
// ================================================================== the Sky Bench: the game's sky, alone
// The game's sky (src/sky/*.js) and the game's WebGL renderer (src/40-gl.js), as they are, with nothing else in the frame:
// a camera to pan and zoom through the game's zoom steps, the game's hour and weather, the game's SKY EDITOR, and the game's
// panel numbers. What costs here costs the same in the game (user Oct 28: "the clouds are the most expensive thing. So we
// need to debug them in their own environment"). The Cloud Lab stays the studio for shapes, brushes and smoke.
// (what the two files expect of the game: a canvas maker, a build stamp)
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const BUILD = 'SKY BENCH';
const GAME_VERSION = 0;

// (the game's GPU water, 40-zz-water-gl.js, is not in the bench: the renderer's hooks into it stand still - Oct 29)
// (Nov 7: the game's 40-zz-water-gl.js is in the bench now - the decks' veils are drawn by it, wglVeilStrip / wglVeilBox: build.py)

// (the game's picture memory, 04-zzz-pics.js, is not in the bench: the renderer's and the sky's calls into it count nothing and keep
// everything - Nov 7)
const PIC_TAG = false;
const PICS = { frame: 0, tagNext: null, tight: false, gpu: 0, bytes: 0 };
function picMaker() { return ''; }
function picUnpack() { }
function picKeep(c) { return c; }
function picUse(o) { return o; }

// (the game's HUD state: the renderer asks whether the perf panel is open, for its GPU timers - Nov 7)
const ui = { perfPanel: false };

const SMOKE_COLS = {
  cBlue: [[132, 182, 255], [88, 142, 242], [60, 112, 216], [44, 86, 180], [32, 64, 142]],
  cYellow: [[255, 242, 140], [252, 216, 84], [234, 188, 52], [202, 152, 38], [162, 118, 30]],
  cRed: [[255, 128, 116], [238, 76, 66], [208, 50, 48], [168, 36, 38], [126, 26, 30]],
  cGreen: [[150, 238, 136], [96, 208, 98], [64, 174, 76], [44, 138, 60], [32, 102, 46]],
  cOrange: [[255, 196, 116], [252, 154, 62], [228, 120, 38], [190, 92, 30], [148, 68, 24]],
  cPink: [[255, 178, 224], [248, 126, 194], [224, 90, 166], [186, 64, 138], [142, 46, 106]],
};
/* ================================================================
   WebGL renderer
   The world is drawn with WebGL2. Rather than rewrite every drawing function, the world's drawing contexts
   are GLCtx objects: they speak the part of the Canvas 2D language the game uses (rectangles, images,
   gradients, paths, clips, transforms, alpha and blend modes) and turn it into large batches of quads for
   the graphics chip, so thousands of rectangles and sprites cost a handful of draw calls instead of
   thousands of canvas commands. The side layers (objects, light, smoke) are GLTargets: textures the GPU
   draws into, which look like canvases to the rest of the code. Sprites still built on ordinary 2D
   canvases are uploaded once as textures (the small ones share one big atlas) and again only when that
   canvas has been drawn on since. Everything is premultiplied alpha, as a canvas is inside, so the blend
   modes are the canvas's own Porter-Duff rules.
   Falls back to Canvas 2D when WebGL2 isn't available, or with ?gl=0.
   ================================================================ */
const GLR = {
  on: false, gl: null, lost: false, epoch: 0, prog: null, vao: null, vbo: null, ibo: null, tvao: null, tvbo: null,
  MAXQ: 8192, QW: 27, ab: null, f32: null, u32: null, n: 0, slots: [], tris: new Float32Array(1 << 14),
  st: { tgt: null, blend: 'source-over', sc: null, clip: false, sten: 0 },     // the pending batch's state
  cur: {},                                                                       // the state GL is actually in
  near: null, lin: null, gradTex: null, gradGen: 1, gradNext: 0, gradPx: new Uint8Array(1024),
  pix: null, screen: null, onRestore: [], uSize: null, unit: [], unitS: [],
  stats: { draws: 0, quads: 0, uploads: 0, upPx: 0, atlas: 0, fills: 0, clips: 0 }, shown: {},
};
const GLB = {};
const GL_TEXFIX = !/[?&]texfix=0/.test(location.search);   // (the sprites' texel choice from the pixel's place - drawImage, GL_FS)                                   // blend modes: [srcRGB, dstRGB, srcA, dstA]
// (60-fps chat, Oct 30: one record a quad, drawn instanced - its four corners picked by gl_VertexID from the same six indices
// as before (0 1 2, 0 2 3) - instead of four vertices a quad: 27 numbers written and uploaded a quad, not 60; the same triangles)
const GL_VS = `#version 300 es
layout(location=0) in vec4 a_p01;
layout(location=1) in vec4 a_p23;
layout(location=2) in vec4 a_uv01;
layout(location=3) in vec4 a_uv23;
layout(location=4) in vec4 a_col;
layout(location=5) in vec2 a_aux;
layout(location=6) in vec4 a_mul;
layout(location=7) in vec4 a_add;
layout(location=8) in vec4 a_o;
layout(location=9) in vec2 a_s;
uniform vec2 u_size;
out vec2 v_uv; out vec4 v_col; out vec4 v_mul; out vec4 v_add;
flat out vec4 v_o; flat out vec2 v_s;
flat out int v_mode; flat out int v_slot; flat out float v_row; flat out float v_k;
void main() {
  int c = gl_VertexID < 3 ? gl_VertexID : gl_VertexID == 3 ? 0 : gl_VertexID == 4 ? 2 : 3;   // (six vertices a quad: the triangles 0 1 2 and 0 2 3)
  vec2 a_pos = c == 0 ? a_p01.xy : c == 1 ? a_p01.zw : c == 2 ? a_p23.xy : a_p23.zw;
  vec2 a_uv = c == 0 ? a_uv01.xy : c == 1 ? a_uv01.zw : c == 2 ? a_uv23.xy : a_uv23.zw;
  vec2 p = a_pos / u_size;
  gl_Position = vec4(p.x * 2.0 - 1.0, 1.0 - p.y * 2.0, 0.0, 1.0);
  v_uv = a_uv; v_col = a_col; v_mul = a_mul; v_add = a_add; v_o = a_o; v_s = a_s;
  int q = int(a_aux.x + 0.5);
  v_mode = q & 7; v_slot = (q >> 3) & 15; v_row = float(q >> 7); v_k = a_aux.y;
}`;
const GL_FS = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D u_t0, u_t1, u_t2, u_t3, u_t4, u_t5, u_t6, u_t7, u_grad;
uniform vec2 u_size;
in vec2 v_uv; in vec4 v_col; in vec4 v_mul; in vec4 v_add;
flat in vec4 v_o; flat in vec2 v_s;
flat in int v_mode; flat in int v_slot; flat in float v_row; flat in float v_k;
out vec4 o;
vec4 tx(int s, vec2 uv) {
  if (s < 4) {
    if (s < 2) return s == 0 ? textureLod(u_t0, uv, 0.0) : textureLod(u_t1, uv, 0.0);
    return s == 2 ? textureLod(u_t2, uv, 0.0) : textureLod(u_t3, uv, 0.0);
  }
  if (s < 6) return s == 4 ? textureLod(u_t4, uv, 0.0) : textureLod(u_t5, uv, 0.0);
  return s == 6 ? textureLod(u_t6, uv, 0.0) : textureLod(u_t7, uv, 0.0);
}
void main() {
  vec2 ddx = dFdx(v_uv), ddy = dFdy(v_uv);              // (taken before any branch: a scaled sprite's footprint)
  // (engine stage 6, Oct 30, the texel choice: an upright sprite (v_s set) works out its texture coordinate from this pixel's
  // place relative to its own corner - (pixel - corner) x texels a pixel + the corner's - not from the coordinate interpolated
  // across the triangle, whose last bits depend on where on the target the quad sits and the target's size. A pixel's centre
  // right on a texel's edge then picks the same texel on the screen and in a kept layer, on every GPU. ?texfix=0: the old way)
  vec2 uv = v_uv;
  if (v_s.x != 0.0) { uv = v_o.zw + (vec2(gl_FragCoord.x, u_size.y - gl_FragCoord.y) - v_o.xy) * v_s; ddx = vec2(v_s.x, 0.0); ddy = vec2(0.0, v_s.y); }
  if (v_mode == 0) { o = v_col; return; }
  if (v_mode == 1) { o = tx(v_slot, uv) * v_col; return; }
  if (v_mode == 4) {
    // a tinted sprite (the copies darkArt / warmed / fogged / coastTinted / moonArt 'mB' made on canvases):
    // colour x mul + add, the add laid over the shape as 'source-atop' would; mul.a set: every pixel of the
    // shape made opaque first (the coast's recolouring did that)
    vec4 t = tx(v_slot, uv), m = v_mul;
    if (v_mul.a > 0.5) { if (t.a <= 0.0) { o = vec4(0.0); return; } o = vec4(t.rgb / t.a * m.rgb + v_add.rgb, 1.0) * v_col; }
    else o = vec4(t.rgb * m.rgb + v_add.rgb * t.a, t.a) * v_col;
    return;
  }
  if (v_mode == 5) {
    // a sprite drawn smaller or bigger than its picture (what scaled() copies were for): n x n samples spread
    // over the screen pixel's footprint and averaged (a box filter, so a big picture shrunk keeps its detail),
    // then, hard, the alpha cut at 110/255 so the edge stays crisp pixel art; then its tint, if any
    int q = int(v_k + 0.5), n = q & 7;
    vec4 acc = vec4(0.0);
    for (int j = 0; j < 4; j++) { if (j >= n) break;
      for (int i = 0; i < 4; i++) { if (i >= n) break;
        acc += tx(v_slot, uv + ddx * ((float(i) + 0.5) / float(n) - 0.5) + ddy * ((float(j) + 0.5) / float(n) - 0.5)); } }
    vec4 t = acc / float(n * n);
    if ((q & 8) != 0) { if (t.a < 0.4314) { o = vec4(0.0); return; } t = vec4(t.rgb / t.a, 1.0); }
    t.rgb = t.rgb * v_mul.rgb + v_add.rgb * t.a;
    o = t * v_col;
    return;
  }
  float t = v_mode == 2 ? v_uv.x : length(v_uv) - v_k;
  t = clamp(t, 0.0, 1.0);
  o = textureLod(u_grad, vec2((t * 255.0 + 0.5) / 256.0, (v_row + 0.5) / 256.0), 0.0) * v_col.a;
}`;
/* ---- the clouds' puffs and lobes (the new sky, src/sky): one instance a shape, drawn straight into a deck's layer at cell
   resolution, exactly as the sky's software rasterizer draws them (04-buffers.js disc / discShade, 11-drawing.js drawLobes):
   a disc of k = round(2r) cells across - rows -floor(R)..floor(R), each as wide as floor(sqrt((R+0.5)^2 - dy^2)) - in one tone
   or with the light running across it (tone = floor(f0 + gx*dx + gy*dy) clamped to lo..hi); a lobe as an ellipse in three
   columns of five bands. A record is 8 floats: disc (x, y, k, f0, gx, gy, lo + 8*hi, 0); lobe (cx, cy, rx, ry, yMax, T0, T1, 1),
   the lobe's 15 tones packed 3 bits each in T0 (0-7) and T1 (8-14). (x, y) are relative to the batch's offset (u_off), so a
   cloud's batch is built once and drawn wherever the cloud drifts. The tones are the batch's six palette colours. ---- */
const GL_PVS = `#version 300 es
layout(location=0) in vec2 a_q;
layout(location=1) in vec4 a_r0;
layout(location=2) in vec4 a_r1;
uniform vec2 u_size; uniform vec2 u_off;
flat out vec4 v_r0; flat out vec4 v_r1; flat out vec2 v_c0;
void main() {
  vec2 lo, hi;
  v_c0 = a_r0.xy;   // (its place in its own cloud: EDGE BREAK's pattern goes with the cloud, not the screen)
  bool lobe = abs(a_r1.w - 1.0) < 0.5;   // (a lobe: 1; a disc: 0, a debug id < 0, or THE BURN's code >= 2)
  if (!lobe) { float n = floor(a_r0.z * 0.5); lo = vec2(a_r0.x - n - 1.0, a_r0.y - n); hi = vec2(a_r0.x + n + 2.0, a_r0.y + n + 1.0); }
  else { lo = vec2(floor(a_r0.x - a_r0.z) - 1.0, floor(a_r0.y - a_r0.w + 0.5)); hi = vec2(ceil(a_r0.x + a_r0.z) + 2.0, min(floor(a_r0.y + a_r0.w + 0.5), a_r1.x) + 1.0); }
  vec2 p = (u_off + mix(lo, hi, a_q)) / u_size;
  gl_Position = vec4(p.x * 2.0 - 1.0, 1.0 - p.y * 2.0, 0.0, 1.0);
  v_r0 = a_r0 + vec4(u_off, 0.0, 0.0); v_r1 = a_r1 + vec4(lobe ? u_off.y : 0.0, 0.0, 0.0, 0.0);
}`;
const GL_PFS = `#version 300 es
precision highp float; precision highp int;
uniform vec2 u_size; uniform vec4 u_pal[15];
flat in vec4 v_r0; flat in vec4 v_r1; flat in vec2 v_c0;
uniform float u_edge;
uniform vec3 u_burn;   // (THE BURN's colour of the hour - 02-hour.js E.burn)
out vec4 o;
// (EDGE BREAK, Oct 30 - the user, with a reference: its puffs have "this more detailed 'edge' around them that breaks the 'balls'
// shape ... versus our clouds that are more circles". A puff's outer ring of pixels is broken up: each pixel near its edge left out
// by chance, more often the nearer the edge, so the outline is notched and stepped, one pixel at a time. The chance is a hash of
// the pixel's place in its puff and the puff's place in its cloud, so a puff keeps its pattern wherever the cloud drifts)
float edgeHash(vec2 d, vec2 c) {
  uvec3 q = uvec3(ivec3(int(floor(d.x)) + 4096, int(floor(d.y)) + 4096, int(floor(c.x * 4.0)) * 7919 + int(floor(c.y * 4.0)) * 104729));
  uint h = q.x * 1597334677u ^ q.y * 3812015801u ^ q.z * 2798796415u;
  h = (h ^ (h >> 15)) * 2246822519u; h ^= h >> 13;
  return float(h & 0xffffffu) / 16777216.0;
}
void main() {
  float fx = floor(gl_FragCoord.x), fy = floor(u_size.y - gl_FragCoord.y);
  int t; float burnK = 0.0;
  if (abs(v_r1.w - 1.0) >= 0.5) {
    float R = v_r0.z * 0.5, n = floor(R), dx = fx - v_r0.x, dy = fy - v_r0.y;
    if (abs(dy) > n || dx * dx + dy * dy > (R + 0.5) * (R + 0.5)) discard;
    if (u_edge > 0.0 && R >= 1.5) {   // (EDGE BREAK: a puff of three cells or more; the ring a cell and a bit deep, wider on big puffs)
      // (in little clumps, not lone pixels: two cells together most of the time - notches and steps, as the reference's)
      float rim = R + 0.5 - sqrt(dx * dx + dy * dy), w = 1.0 + 0.08 * R;
      float h = 0.7 * edgeHash(floor(vec2(dx, dy) * 0.5), v_c0 + 0.37) + 0.3 * edgeHash(vec2(dx, dy), v_c0);
      if (rim < w && h < u_edge * (1.0 - rim / w) * 0.85) discard;
    }
    int lh = int(v_r1.z + 0.5);
    t = clamp(int(floor(v_r0.w + v_r1.x * dx + v_r1.y * dy)), lh & 7, lh >> 3);
    // (THE BURN, 13:23 - the user: "It needs to actually affect and use the way we render and draw the balls for the clouds. Like we do the
    // thunder lighting. We want to feel the '3d' of it". A puff the light pass found burning (its code: 2 + the way to the disc in
    // sixteenths of a turn, 16 all round, + how much) is lit on its side toward the disc - a crescent of the burn's colour on the ball,
    // its middle and far side left in the cloud's own tone - all round its rim when the disc is right behind it. In thirds: flat steps)
    if (v_r1.w > 1.5) {
      float w = v_r1.w - 2.0, ai = floor(w), bb = (w - ai) / 0.98;
      vec2 nn = vec2(dx, dy) / max(R, 1.0); float rr = length(nn);
      float cres = R < 2.5 ? 1.0 : ai > 15.5 ? smoothstep(0.3, 0.95, rr) : clamp(dot(nn, vec2(cos(ai * 0.3927), sin(ai * 0.3927))) * 1.5 + 0.15 * rr - 0.1, 0.0, 1.0);   // (a puff too small for a crescent: the billow's own side carries it)
      burnK = floor(bb * cres * 3.0 + 0.4) / 3.0;
    }
  } else {
    float cx = v_r0.x, cy = v_r0.y, rx = v_r0.z, ry = v_r0.w;
    if (fy > v_r1.x) discard;
    float v = (cy - fy) / ry; if (v > 1.0 || v < -1.0) discard;
    float hw = rx * sqrt(1.0 - v * v), xL = floor(cx - hw + 0.5), xR = max(xL, floor(cx + hw + 0.5) - 1.0);
    if (fx < xL || fx > xR) discard;
    int b = clamp(int(floor((1.0 - v) * 2.0 + 0.5)), 0, 4), idx;
    if (xR - xL < 3.0) idx = b * 3 + 1;
    else { float x1 = floor(cx - hw / 3.0 + 0.5), x2 = floor(cx + hw / 3.0 + 0.5); idx = fx < x1 ? b * 3 : (fx < x2 ? b * 3 + 1 : b * 3 + 2); }
    int T0 = int(v_r1.y + 0.5), T1 = int(v_r1.z + 0.5);
    t = idx < 8 ? (T0 >> (idx * 3)) & 7 : (T1 >> ((idx - 8) * 3)) & 7;
  }
  if (v_r1.w < -0.5) {   // (a debug VIEW: its colour by its id, its light by its tone, then the haze - toneCol)
    int ci = int(-v_r1.w + 0.5) - 1;
    vec3 col = ci >= 8 ? vec3(40.0 + float(t) * 50.0) / 255.0 : mix(vec3(20.0, 20.0, 30.0) / 255.0, u_pal[6 + ci].rgb, 0.45 + float(t) * 0.14);
    o = vec4(mix(col, u_pal[14].rgb, u_pal[14].a), 1.0); return;
  }
  o = u_pal[clamp(t, 0, 5)];
  o.rgb = mix(o.rgb, u_burn * o.a, burnK);
}`;
/* ---- the sky's light rays (16-light-rays.js): the fan of wedges from the sun, each ray's light left after the clouds it
   crossed, as a fragment program. The CPU keeps walking the rays (RAY_N of them, NS steps each: a byte a step, T | inn << 2
   | hit << 4, in a texture NS wide and RAY_N tall) and the fan's wedges (tier and length a ray, RAY_N x 1); every cell of
   the picture then finds its wedge (atan) and its step (its distance) on the GPU - where it was a pass over every cell of
   the sky in JS: a clear sky with the sun out, 24 ms a frame on the user's PC. ---- */
const GL_RVS = `#version 300 es
layout(location=0) in vec2 a_q;
uniform vec2 u_size; uniform vec4 u_quad; uniform vec4 u_cells;
out vec2 v_cell;
void main() {
  vec2 p = (u_quad.xy + a_q * u_quad.zw) / u_size;
  gl_Position = vec4(p.x * 2.0 - 1.0, 1.0 - p.y * 2.0, 0.0, 1.0);
  v_cell = mix(u_cells.xy, u_cells.zw, a_q);
}`;
const GL_RFS = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D u_rt, u_rb;
uniform vec2 u_sun; uniform vec4 u_p; uniform vec4 u_k; uniform vec4 u_k2; uniform vec3 u_col;
in vec2 v_cell;
out vec4 o;
void main() {
  vec2 c = floor(v_cell);
  if (c.y >= u_k2.z || c.y < 0.0 || c.x < 0.0) discard;
  float dx = c.x - u_sun.x, dy = c.y - u_sun.y, RN = u_p.z;
  int bi = int(mod(floor((atan(dy, dx) + 3.14159265) * RN / 6.2831853), RN));
  vec2 rb = texelFetch(u_rb, ivec2(bi, 0), 0).rg;
  int tier = int(rb.r * 255.0 + 0.5);
  if (tier == 0) discard;
  float d = sqrt(dx * dx + dy * dy), u = d / (u_p.x * rb.g);
  if (u >= 1.0 || d < u_k2.w) discard;   // (user Oct 29: "the light rays should render behind the sun" - none over its disc, u_k2.w its radius in cells)
  float sf = u_k2.w > 0.0 ? floor(clamp((d - u_k2.w) / max(1.0, u_k2.w * 0.6), 0.0, 1.0) * 4.0) / 4.0 : 1.0;   // (faded in just past it, in four steps)
  int j = int(floor(d / u_p.w));
  if (j >= int(u_p.y)) discard;
  int v = int(texelFetch(u_rt, ivec2(j, bi), 0).r * 255.0 + 0.5);
  int hit = (v >> 4) & 1, T = hit == 1 ? v & 3 : 3, inn = hit == 1 ? (v >> 2) & 3 : 0;
  if (T == 0 || inn == 2) discard;
  float K = u < 0.35 ? u_k.x : u < 0.6 ? u_k.y : u < 0.82 ? u_k.z : u_k.w;
  float k = min(0.85, K * (tier == 2 ? 1.0 : 0.5) * u_k2.x * (inn != 0 ? u_k2.y : 1.0));
  k *= (T == 3 ? 1.0 : T == 2 ? 0.6 : 0.3) * sf;
  float a = floor(k * 255.0 + 0.5) / 255.0;
  o = vec4(u_col * a, a);
}`;
// THE RAYS' MARCH (engine stage 8, Oct 30): the step bytes above, made here - one fragment a step of a ray (x the step, y the ray).
// u_ray a ray's (first crossing, crossings, first step outside every lobe, hit); u_iv the crossings (entry step, exit step - NS when
// it runs off the end), each ray's by entry step. The lobes the step is in (n) and the steps of cloud before it (M, n summed over
// the steps before - the march's running sums, closed form) give its level by u_m, whole steps: the march's od is M x sig
const GL_RBUILD_FS = `#version 300 es

function gameAdd(kind, o) {

  const sx = o && o.x != null ? o.x : cam.refX - dir * bw / z * 0.45;

  gameObjs.push(g); return g;

  for (const g of gameObjs) { g.x += g.f * g.v * GU() * dt; if (g.f > 0 && g.x > cam.refX + half) g.x -= 2 * half; if (g.f < 0 && g.x < cam.refX - half) g.x += 2 * half; }   // (out of the view: back in at the other side)

    const x = PX(g.x) - w / 2, y = g.kind === 'ship' ? PY(WATER_Y) - Math.round(193 * k) : PY(g.y) - h / 2;   // (the ship's waterline at the sea's line)
